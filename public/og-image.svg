<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Logo + Title aligned horizontally -->
  <g transform="translate(600, 140)">
    <!-- Microsoft 365 Four Color Logo -->
    <g transform="translate(-310, -35)">
      <rect width="35" height="35" x="0" y="0" fill="#f25022"/>
      <rect width="35" height="35" x="38" y="0" fill="#7fba00"/>
      <rect width="35" height="35" x="0" y="38" fill="#00a4ef"/>
      <rect width="35" height="35" x="38" y="38" fill="#ffb900"/>
    </g>
    <!-- Main Title -->
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">Free365Key</text>
  </g>

  <!-- Subtitle -->
  <text x="600" y="230" font-family="Arial, sans-serif" font-size="38" fill="rgba(255,255,255,0.95)" text-anchor="middle">Your Microsoft 365 Resource Hub</text>

  <!-- Feature pills -->
  <rect x="150" y="280" width="240" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="270" y="313" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">Licensing Guides</text>

  <rect x="420" y="280" width="200" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="520" y="313" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">Plan Finder</text>

  <rect x="650" y="280" width="240" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="770" y="313" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">Plan Comparison</text>

  <rect x="920" y="280" width="230" height="50" rx="25" fill="rgba(255,255,255,0.2)"/>
  <text x="1035" y="313" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle">Free Giveaway</text>

  <!-- Tagline -->
  <text x="600" y="400" font-family="Arial, sans-serif" font-size="26" fill="rgba(255,255,255,0.85)" text-anchor="middle">Compare plans, find the right license, and enter our monthly giveaway</text>

  <!-- Call to Action Button -->
  <rect x="300" y="455" width="600" height="70" rx="35" fill="#10b981"/>
  <text x="600" y="500" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">Find the Perfect Plan for Your Business</text>

  <!-- Bottom URL -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle">www.free365key.com</text>
</svg>
